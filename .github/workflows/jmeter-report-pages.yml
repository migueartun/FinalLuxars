name: Publish JMeter report

on:
  push:
    branches:
      - main
    paths:
      - luxars_App
      - .github/workflows/jmeter-report-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and report submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: luxars_App/reporte_html

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
